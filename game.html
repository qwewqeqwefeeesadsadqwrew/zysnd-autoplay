<script>/* __localConfigHook: 把远程 configlive 指向本地，离线也能跑 */
(function(){
  var LOCAL='configlive.json';
  function rewrite(u){try{if(u&&String(u).indexOf('configlive.json')>=0)return new URL(LOCAL,location.href).href;}catch(e){}return u;}
  var of=window.fetch;
  if(of){window.fetch=function(input,init){try{if(typeof input==='string')input=rewrite(input);else if(input&&input.url){var n=rewrite(input.url);if(n!==input.url)input=new Request(n,input);}}catch(e){}return of.call(this,input,init);};}
  var OX=window.XMLHttpRequest;
  if(OX){function PX(){var x=new OX();var o=x.open;x.open=function(m,u){var a=Array.prototype.slice.call(arguments);a[1]=rewrite(u);return o.apply(x,a);};return x;}PX.prototype=OX.prototype;window.XMLHttpRequest=PX;}
})();
</script>
